<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Final PRO - Laporan Patroli (Generated)</title>
<!-- jsPDF and autotable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{ --primary:#0b3d91; --muted:#6b7280; --card:#f8fafc; --accent:#4f46e5; }
  body{font-family:Inter, system-ui, Arial, sans-serif; margin:0; background:#f3f4f6; color:#0f1724;}
  .container{max-width:980px;margin:18px auto;padding:16px;}
  header{display:flex;align-items:center;gap:12px}
  header .logo{width:64px;height:64px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
  header h1{font-size:18px;margin:0}
  .card{background:#fff;border-radius:12px;padding:14px;margin-top:12px;box-shadow:0 6px 18px rgba(15,23,36,0.04)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .col{flex:1;min-width:220px}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
  input[type="text"], input[type="date"], input[type="time"], select, textarea{width:100%;padding:10px;border:1px solid #e6e9ee;border-radius:8px;font-size:14px}
  textarea{min-height:80px}
  .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
  .btn-ghost{background:transparent;border:1px solid #e6e9ee;color:#111}
  .download-options{display:flex;gap:8px;flex-wrap:wrap}
  .areas{margin-top:12px}
  .area{border:1px dashed #e6eef9;padding:10px;border-radius:8px;margin-bottom:10px;background:linear-gradient(180deg,#ffffff,#fbfdff)}
  .area h3{margin:0 0 6px 0}
  .photo-grid{display:flex;gap:8px;flex-wrap:wrap}
  .photo-thumb{width:84px;height:84px;border-radius:6px;overflow:hidden;background:#eef2ff;display:flex;align-items:center;justify-content:center}
  .small{font-size:12px;color:var(--muted)}
  .fixed-bottom{position:fixed;right:12px;bottom:12px;z-index:200000}
  /* progress overlay */
  #__pdf_progress_overlay{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(6,8,15,0.6);display:flex;align-items:center;justify-content:center;z-index:999999}
  #__pdf_progress_card{background:#0b1220;color:#fff;padding:18px;border-radius:12px;max-width:420px;text-align:center}
  #__pdf_progress_bar{height:10px;background:#fff;border-radius:6px;overflow:hidden}
  #__pdf_progress_inner{height:10px;width:0%;background:linear-gradient(90deg,#06b6d4,#4f46e5)}
  footer{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo" id="uiLogoContainer"><img id="uiLogoImg" src="" alt="Logo" style="max-width:100%;max-height:100%;display:none"></div>
    <div>
      <h1>FINAL PRO - Laporan Patroli</h1>
      <div class="small">Versi final: satu file. Cover besar. Dua-kolom detail. Kompres & chunking.</div>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div class="col">
        <label>Nama Petugas</label>
        <input id="petugasName" type="text" placeholder="Nama petugas..." />
      </div>
      <div class="col">
        <label>Shift</label>
        <input id="shift" type="text" placeholder="Shift..." />
      </div>
      <div class="col">
        <label>Tanggal</label>
        <input id="tanggal" type="date" />
      </div>
      <div class="col">
        <label>Jam</label>
        <input id="jam" type="time" />
      </div>
    </div>

    <div style="margin-top:12px" class="row">
      <div>
        <label>Upload Logo (PNG/JPEG)</label>
        <input id="uploadLogo" type="file" accept="image/*" />
      </div>
      <div style="align-self:end">
        <button id="saveLogoBtn" class="btn btn-ghost">Simpan Logo</button>
      </div>
      <div style="align-self:end">
        <button id="clearStorage" class="btn btn-ghost">Reset Data</button>
      </div>
    </div>

    <div class="download-options" style="margin-top:12px">
      <button id="btnAddArea" class="btn btn-ghost">+ Tambah Area</button>
      <button id="btnCompressAll" class="btn btn-ghost">📦 Kompres Semua Foto</button>
      <button id="btnBackup" class="btn btn-ghost">💾 Backup/Restore</button>
      <button id="btnProPdf" class="btn btn-primary">📄 Generate PRO PDF</button>
    </div>
  </div>

  <div id="areasContainer" class="areas"></div>

  <div style="margin-top:12px" class="card">
    <div class="small">Preview Foto (ketuk untuk tambah deskripsi / hapus)</div>
    <div id="previewNote" class="small">Tidak ada foto.</div>
  </div>

  <footer>© Generated - Professional Security Patrol System</footer>
</div>

<!-- progress overlay (hidden initially) -->
<div id="__pdf_progress_overlay" style="display:none">
  <div id="__pdf_progress_card">
    <div style="font-weight:700;font-size:16px;margin-bottom:8px">🔄 Membuat PDF — Mohon tunggu</div>
    <div id="__pdf_progress_text" style="margin-bottom:8px">Mempersiapkan...</div>
    <div id="__pdf_progress_bar"><div id="__pdf_progress_inner"></div></div>
    <div style="margin-top:8px;font-size:12px;color:#cbd5e1" id="__pdf_progress_sub">Jangan tutup halaman ini.</div>
  </div>
</div>

<script>
/* FULL SCRIPT OMITTED FOR BREVITY IN CHUNK; WILL BE ADDED BELOW */
</script>

</body>
</html>

<script>
(async function(){
// utilities
function showOverlay(){ document.getElementById('__pdf_progress_overlay').style.display='flex'; }
function hideOverlay(){ document.getElementById('__pdf_progress_overlay').style.display='none'; }
function setProgress(percent, text){ const inner=document.getElementById('__pdf_progress_inner'); const t=document.getElementById('__pdf_progress_text'); inner.style.width = Math.max(0,Math.min(100,percent))+'%'; if(t && text) t.innerText = text; }

// state
let patrolData = {};
let signatureData = null;
let __pdf_logo_base64 = null;

// load
try{
  const raw = localStorage.getItem('patrol_pro_data_v1'); if(raw) patrolData = JSON.parse(raw);
  const sig = localStorage.getItem('patrol_pro_signature_v1'); if(sig) signatureData = sig;
  const logo = localStorage.getItem('patrol_pro_logo_v1'); if(logo){ __pdf_logo_base64 = logo; document.getElementById('uiLogoImg').src = logo; document.getElementById('uiLogoImg').style.display='block'; }
}catch(e){ console.warn('load err', e); }

// helpers
function persist(){ localStorage.setItem('patrol_pro_data_v1', JSON.stringify(patrolData)); if(signatureData) localStorage.setItem('patrol_pro_signature_v1', signatureData); if(__pdf_logo_base64) localStorage.setItem('patrol_pro_logo_v1', __pdf_logo_base64); }
function sanitizeFileName(s){ return (s||'file').replace(/[^a-z0-9_\-]/gi,'_'); }

// image utilities
function fileToDataURL(file, quality=0.8, maxSize=1600){ return new Promise((resolve)=>{ const reader=new FileReader(); reader.onload=function(){ const img=new Image(); img.onload=function(){ let w=img.width,h=img.height; if(w>h && w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } else if(h>maxSize && h>=w){ w=Math.round(w*maxSize/h); h=maxSize; } const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); try{ const data=c.toDataURL('image/jpeg', quality); resolve(data);}catch(e){ resolve(reader.result); } }; img.onerror=function(){ resolve(reader.result); }; img.src=reader.result; }; reader.readAsDataURL(file); }); }

function reencodeDataUrl(dataUrl, quality=0.75, maxSize=1200){ return new Promise((resolve)=>{ const img=new Image(); img.onload=function(){ let w=img.width,h=img.height; if(w>h && w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } else if(h>maxSize && h>=w){ w=Math.round(w*maxSize/h); h=maxSize; } const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h); try{ resolve(c.toDataURL('image/jpeg', quality)); }catch(e){ resolve(dataUrl); } }; img.onerror=function(){ resolve(dataUrl); }; img.src=dataUrl; }); }

async function chunkProcessImages(items, handler, chunkSize=2, delay=150){ let processed=0; for(let i=0;i<items.length;i+=chunkSize){ const chunk=items.slice(i,i+chunkSize); await Promise.all(chunk.map(async (it)=>{ await handler(it, processed, items.length); processed++; const pct = Math.round((processed/items.length)*100); setProgress(pct, `Memproses ${processed}/${items.length} foto`); })); await new Promise(r=>setTimeout(r, delay)); } }

// UI area render
function createAreaCard(areaId, area){
  const div=document.createElement('div'); div.className='area'; div.dataset.id=areaId;
  div.innerHTML = `<h3>Area ${areaId}: <input data-field="name" value="${area.name||''}" style="border:none;background:transparent;font-weight:700;font-size:14px" /></h3>
    <div style="margin-bottom:6px"><label class="small">Catatan Area</label><textarea data-field="notes">${area.notes||''}</textarea></div>
    <div style="margin-bottom:6px"><label class="small">Deskripsi Global</label><textarea data-field="global">${area.globalDescription||''}</textarea></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <input type="file" accept="image/*" data-upload class="area-upload" />
      <button class="btn btn-ghost btn-add-photo">Ambil Foto / Upload</button>
      <button class="btn btn-ghost btn-remove-area">Hapus Area</button>
    </div>
    <div class="photo-grid" data-photos></div>`;
  const nameIn = div.querySelector('[data-field="name"]'); const notesIn = div.querySelector('[data-field="notes"]'); const globalIn = div.querySelector('[data-field="global"]');
  nameIn.addEventListener('input', (e)=>{ area.name=e.target.value; persist(); });
  notesIn.addEventListener('input', (e)=>{ area.notes=e.target.value; persist(); });
  globalIn.addEventListener('input', (e)=>{ area.globalDescription=e.target.value; persist(); });
  const fileInput = div.querySelector('[data-upload]');
  fileInput.addEventListener('change', async (ev)=>{ const f=ev.target.files[0]; if(!f) return; const dataUrl = await fileToDataURL(f, 0.8, 1200); area.photos.push(dataUrl); area.descriptions.push(''); persist(); renderAreas(); });
  div.querySelector('.btn-add-photo').addEventListener('click', ()=> fileInput.click());
  div.querySelector('.btn-remove-area').addEventListener('click', ()=>{ if(!confirm('Hapus area ini?')) return; delete patrolData[areaId]; persist(); renderAreas(); });
  const photosContainer = div.querySelector('[data-photos]'); photosContainer.innerHTML=''; (area.photos||[]).forEach((p, idx)=>{ const t=document.createElement('div'); t.className='photo-thumb'; t.innerHTML=`<img src="${p}" style="width:100%;height:100%;object-fit:cover"/>`; t.addEventListener('click', ()=>{ const desc = prompt('Deskripsi foto', area.descriptions[idx]||'')||''; area.descriptions[idx]=desc; persist(); renderAreas(); }); t.addEventListener('contextmenu',(e)=>{ e.preventDefault(); if(confirm('Hapus foto ini?')){ area.photos.splice(idx,1); area.descriptions.splice(idx,1); persist(); renderAreas(); } }); photosContainer.appendChild(t); });
  return div;
}
function renderAreas(){ const c=document.getElementById('areasContainer'); c.innerHTML=''; const keys=Object.keys(patrolData); if(keys.length===0) document.getElementById('previewNote').innerText='Tidak ada foto.'; else document.getElementById('previewNote').innerText='Klik thumbnail untuk tambah deskripsi. Tekan kanan (long press) untuk hapus.'; keys.forEach(k=>c.appendChild(createAreaCard(k, patrolData[k]))); }

// buttons
document.getElementById('btnAddArea').addEventListener('click', ()=>{ const id = Object.keys(patrolData).length; patrolData[id]={ name:'Area '+(id+1), notes:'', globalDescription:'', photos:[], descriptions:[] }; persist(); renderAreas(); });
document.getElementById('uploadLogo').addEventListener('change', async (e)=>{ const f=e.target.files[0]; if(!f) return; const data = await fileToDataURL(f, 0.9, 1600); __pdf_logo_base64 = data; document.getElementById('uiLogoImg').src=data; document.getElementById('uiLogoImg').style.display='block'; persist(); });
document.getElementById('saveLogoBtn').addEventListener('click', ()=>{ if(!__pdf_logo_base64){ alert('Upload logo dulu'); return; } localStorage.setItem('patrol_pro_logo_v1', __pdf_logo_base64); alert('Logo disimpan'); });
document.getElementById('clearStorage').addEventListener('click', ()=>{ if(!confirm('Reset semua data lokal?')) return; localStorage.removeItem('patrol_pro_data_v1'); localStorage.removeItem('patrol_pro_logo_v1'); localStorage.removeItem('patrol_pro_signature_v1'); patrolData={}; signatureData=null; __pdf_logo_base64=null; document.getElementById('uiLogoImg').style.display='none'; renderAreas(); alert('Reset selesai'); });
document.getElementById('btnCompressAll').addEventListener('click', async ()=>{ showOverlay(); setProgress(0,'Memulai kompresi...'); for(const k of Object.keys(patrolData)){ for(let i=0;i<(patrolData[k].photos||[]).length;i++){ patrolData[k].photos[i]=await reencodeDataUrl(patrolData[k].photos[i],0.7,1000); } } persist(); renderAreas(); setProgress(100,'Selesai kompresi'); hideOverlay(); alert('Kompresi selesai'); });
document.getElementById('btnBackup').addEventListener('click', ()=>{ const data={patrolData,signatureData,__pdf_logo_base64,ts:new Date().toISOString()}; const s=JSON.stringify(data,null,2); navigator.clipboard?.writeText(s).then(()=>alert('Backup disalin ke clipboard'), ()=>prompt('Copy backup', s)); });

// pdf gen (same logic as earlier but inlined)
async function generatePDF_final(){
  try{
    const jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : (window.jsPDF ? window.jsPDF : null);
    const jsPDFClass = jsPDFCtor || window.jspdf?.jsPDF || window.jsPDF;
    if(!jsPDFClass){ alert('jsPDF tidak terdeteksi. Pastikan koneksi internet aktif.'); return; }
    showOverlay(); setProgress(2,'Initialisasi dokumen...');
    const pdf = new jsPDFClass('p','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 12;
    const usableWidth = pageWidth - margin*2;
    let y = margin;
    const petugasName = document.getElementById('petugasName').value || 'Petugas_Tidak_Terisi';
    const shift = document.getElementById('shift').value || '-';
    const tanggal = document.getElementById('tanggal').value || new Date().toISOString().split('T')[0];
    const jam = document.getElementById('jam').value || new Date().toTimeString().slice(0,5);

    const allPhotos = [];
    Object.keys(patrolData||{}).forEach(areaKey=>{ const area=patrolData[areaKey]; if(!area) return; (area.photos||[]).forEach((p,idx)=>allPhotos.push({areaKey,src:p,idx})); });

    const processedMap = new Map();
    if(allPhotos.length>0){
      setProgress(6, `Mengoptimalkan ${allPhotos.length} foto...`);
      await chunkProcessImages(allPhotos, async (it)=>{ const compressed = await reencodeDataUrl(it.src,0.75,1200); processedMap.set(it.src, compressed); }, 2, 180);
    }

    // COVER
    try{
      pdf.setFillColor(11,61,145); pdf.rect(0,0,pageWidth,90,'F');
      pdf.setFontSize(20); try{ pdf.setFont('helvetica','bold'); }catch(e){}
      pdf.setTextColor(255,255,255); pdf.text(`Petugas: ${petugasName}`, pageWidth/2, 36, {align:'center'});
      pdf.setFontSize(16); pdf.text(`Tanggal: ${tanggal}   |   Jam: ${jam}`, pageWidth/2, 56, {align:'center'});
      const logoW = pageWidth * 0.75; const logoH = pageHeight * 0.45; const logoX=(pageWidth-logoW)/2; const logoY=110;
      let logoData = __pdf_logo_base64;
      if(!logoData){ const any=allPhotos[0]; if(any) logoData=any.src; }
      if(logoData){ let ld = logoData; if(typeof ld==='string' && !ld.startsWith('data:')) ld='data:image/png;base64,'+ld; try{ pdf.addImage(processedMap.get(logoData)||ld,'JPEG',logoX,logoY,logoW,logoH); }catch(e){ try{ pdf.addImage(processedMap.get(logoData)||ld,'PNG',logoX,logoY,logoW,logoH);}catch(e2){ pdf.setDrawColor(200,200,200); pdf.rect(logoX,logoY,logoW,logoH);} } } else { pdf.setDrawColor(200,200,200); pdf.rect(logoX,logoY,logoW,logoH); }
      pdf.setFontSize(24); pdf.setTextColor(20,30,48); try{ pdf.setFont('helvetica','bold'); }catch(e){}; pdf.text('LAPORAN PATROLI SECURITY', pageWidth/2, logoY+logoH+30, {align:'center'}); pdf.setFontSize(12); pdf.setTextColor(110,110,110); pdf.text(`Generated: ${new Date().toLocaleString('id-ID')}`, pageWidth/2, logoY+logoH+44, {align:'center'});
    }catch(e){ console.warn('cover error', e); }

    // details
    pdf.addPage(); y=margin;
    pdf.setFillColor(44,62,80); pdf.rect(margin,y,usableWidth,12,'F'); pdf.setFontSize(11); pdf.setTextColor(255,255,255); pdf.text('DETAIL PATROLI', margin+4, y+8); y+=18;
    pdf.setFontSize(10); pdf.setTextColor(60,60,60); pdf.text(`Nama Petugas: ${petugasName}`, margin, y); y+=6; pdf.text(`Shift: ${shift}    Tanggal: ${tanggal}    Jam: ${jam}`, margin, y); y+=10;
    const colGap=8; const colLeftW=Math.round((usableWidth-colGap)*0.45); const colRightW=usableWidth-colLeftW-colGap;
    const areaKeys = Object.keys(patrolData||{}); let totalPhotosProcessed=0; let totalPhotos=allPhotos.length;
    for(let ai=0; ai<areaKeys.length; ai++){ const key=areaKeys[ai]; const area=patrolData[key]; if(!area) continue;
      if(y>pageHeight-160){ pdf.addPage(); y=margin; pdf.setFillColor(44,62,80); pdf.rect(margin,y,usableWidth,12,'F'); pdf.setFontSize(11); pdf.setTextColor(255,255,255); pdf.text('DETAIL PATROLI (lanjutan)', margin+4, y+8); y+=18; }
      const palette=[[41,128,185],[46,204,113],[142,68,173],[231,76,60],[241,196,15],[52,152,219]]; const bg=palette[ai%palette.length]; pdf.setFillColor(bg[0],bg[1],bg[2]); const headerH=16; pdf.rect(margin,y,usableWidth,headerH,'F'); pdf.setFontSize(14); pdf.setTextColor(255,255,255); try{ pdf.setFont('helvetica','bold'); }catch(e){}; const titleText=`${parseInt(key)+1}. ${area.name||'Area'}`; const wrap=pdf.splitTextToSize(titleText, usableWidth-8); for(let wi=0; wi<wrap.length; wi++) pdf.text(wrap[wi], margin+6, y+10+(wi*5)); y+=headerH + (wrap.length>1 ? (wrap.length-1)*5 : 6);

      // area notes/global
      if(area.notes){ const sp = pdf.splitTextToSize('Catatan: '+area.notes, usableWidth-4); pdf.setFontSize(9); pdf.setTextColor(70,70,70); pdf.text(sp, margin+4, y); y+= sp.length*4 + 6; }
      if(area.globalDescription){ const spg = pdf.splitTextToSize(area.globalDescription, usableWidth-4); pdf.setFontSize(9); pdf.setTextColor(80,80,80); pdf.text(spg, margin+4, y); y+= spg.length*4 + 6; }
      const photos = Array.isArray(area.photos)? area.photos : []; const descs = Array.isArray(area.descriptions)? area.descriptions : [];
      for(let i=0;i<photos.length;i++){ const src=photos[i]; const desc=descs[i]||''; const blockH=86; if(y+blockH+40>pageHeight-20){ pdf.addPage(); y=margin; pdf.setFillColor(44,62,80); pdf.rect(margin,y,usableWidth,12,'F'); pdf.setFontSize(11); pdf.setTextColor(255,255,255); pdf.text('DETAIL PATROLI (lanjutan)', margin+4, y+8); y+=18; }
        let imgData = processedMap.get(src) || src;
        try{ if(imgData){ try{ pdf.addImage(imgData,'JPEG',margin,y,colLeftW,blockH); }catch(e){ try{ pdf.addImage(imgData,'PNG',margin,y,colLeftW,blockH); }catch(e2){ pdf.setDrawColor(220,220,220); pdf.rect(margin,y,colLeftW,blockH); } } } else { pdf.setDrawColor(220,220,220); pdf.rect(margin,y,colLeftW,blockH); } }catch(err){ pdf.setDrawColor(220,220,220); pdf.rect(margin,y,colLeftW,blockH); }
        const dx = margin + colLeftW + colGap;
        pdf.setFillColor(252,252,253); pdf.rect(dx-2, y-2, colRightW+4, blockH+4, 'F');
        pdf.setFontSize(12); pdf.setTextColor(30,30,30); try{ pdf.setFont('helvetica','bold'); }catch(e){}; pdf.text(`Foto ${i+1}`, dx, y+10);
        pdf.setFontSize(10); pdf.setTextColor(70,70,70); try{ pdf.setFont('helvetica','normal'); }catch(e){}; const sdesc = pdf.splitTextToSize(desc || '(Deskripsi tidak tersedia)', colRightW-6); pdf.text(sdesc, dx, y+18);
        totalPhotosProcessed++; setProgress(Math.round((totalPhotosProcessed/Math.max(1,totalPhotos))*100), `Menambahkan foto ${totalPhotosProcessed}/${totalPhotos}`);
        y += blockH + 10;
      }
      pdf.setDrawColor(220,220,220); pdf.setLineWidth(0.25); pdf.line(margin, y, pageWidth-margin, y); y+=8;
    }
    // signature
    if(signatureData){ if(y + 70 > pageHeight - 20){ pdf.addPage(); y = margin; pdf.setFillColor(44,62,80); pdf.rect(margin, y, usableWidth, 12, 'F'); pdf.setFontSize(11); pdf.setTextColor(255,255,255); pdf.text('TANDA TANGAN', margin+4, y+8); y += 18; } pdf.setFontSize(12); pdf.setTextColor(44,62,80); pdf.text('TANDA TANGAN PETUGAS', margin, y); y+=8; try{ pdf.addImage(signatureData, 'PNG', margin, y, 80, 40); y+=46; }catch(e){ y+=10; } }
    pdf.setFontSize(8); pdf.setTextColor(120,120,120); pdf.text(`Generated: ${new Date().toLocaleString('id-ID')}`, pageWidth/2, pageHeight - 10, {align:'center'});
    const fileName = `Laporan_Patroli_${sanitizeFileName(petugasName)}_${tanggal}.pdf`;
    pdf.save(fileName);
    hideOverlay(); setProgress(100,'Selesai'); alert('PDF berhasil diunduh: ' + fileName);
    return true;
  }catch(err){ hideOverlay(); console.error('generate pdf failed', err); alert('Gagal membuat PDF: ' + (err && err.message ? err.message : err)); }
}
document.getElementById('btnProPdf').addEventListener('click', async ()=>{ await generatePDF_final(); });
renderAreas();
})();</script>
